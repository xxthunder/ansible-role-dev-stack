---
name: CI
"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: "dev-stack"

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4
        with:
          path: "dev-stack"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test dependencies
        run: pip3 install ansible-core ansible-lint
      - name: Run ansible-lint
        run: ansible-lint
        env:
          ANSIBLE_ROLES_PATH: ".."

  shell-tests:
    name: shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4
        with:
          path: "dev-stack"
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run the agent tests
        run: |
          ./tests/test_agent_convergence.sh
          ./tests/test_agent_selection.sh
          ./tests/test_role_hygiene.sh

  molecule:
    name: molecule
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4
        with:
          path: "dev-stack"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test dependencies
        run: pip3 install ansible-core "molecule-plugins[docker]" docker
      - name: Run Molecule tests
        run: molecule test
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"
