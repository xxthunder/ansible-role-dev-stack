---
name: CI
"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: "dev-stack"

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v7
        with:
          path: "dev-stack"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Run the lint gate
        run: ./scripts/gate lint

  shell-tests:
    name: shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v7
        with:
          path: "dev-stack"
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run the agent tests
        run: ./scripts/gate shell

  molecule:
    name: molecule
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v7
        with:
          path: "dev-stack"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Run Molecule tests
        run: ./scripts/gate molecule
        env:
          ANSIBLE_FORCE_COLOR: "1"
          PY_COLORS: "1"
