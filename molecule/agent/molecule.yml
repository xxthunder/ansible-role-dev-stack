---
# Converge the role with the persistent ssh-agent ON, for a user that never
# logged in — the state of a fresh host. Docker stays off (see the default
# scenario). Exercises linger and the user-scope units on the first run.
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance-agent
    image: geerlingguy/docker-debian13-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
provisioner:
  name: ansible
verifier:
  name: ansible
