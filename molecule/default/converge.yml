---
- name: Converge
  hosts: all
  become: true
  vars:
    dev_stack_apt_upgrade: false
    dev_stack_install_docker: false
    dev_stack_ssh_agent: false
    dev_stack_install_tea: true
    dev_stack_install_uv: true
    dev_stack_install_claude_code: true
    dev_stack_install_gh: true
    dev_stack_install_build_prerequisites: true
  roles:
    - role: dev-stack
