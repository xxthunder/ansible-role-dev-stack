---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Stat the DevPod binary
      ansible.builtin.stat:
        path: /usr/local/bin/devpod
      register: devpod_bin

    - name: Read the sshd hardening drop-in
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config.d/10-dev-stack-hardening.conf
      register: sshd_dropin

    - name: Run the tea CLI
      ansible.builtin.command: /usr/local/bin/tea --version
      changed_when: false

    - name: Run uv
      ansible.builtin.command: /usr/local/bin/uv --version
      changed_when: false
      register: uv_version

    - name: Run uvx
      ansible.builtin.command: /usr/local/bin/uvx --version
      changed_when: false
      register: uvx_version

    - name: Run Claude Code as the login user
      become: true
      become_user: vmuser
      ansible.builtin.command: claude --version
      changed_when: false
      register: claude_version

    - name: Read the Claude Code apt repository
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/claude-code.sources
      register: claude_sources

    - name: Run gh as the login user
      become: true
      become_user: vmuser
      ansible.builtin.command: gh --version
      changed_when: false
      register: gh_version

    - name: Read the gh apt repository
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/github-cli.sources
      register: gh_sources

    - name: Stat the gh signing key
      ansible.builtin.stat:
        path: /etc/apt/keyrings/githubcli-archive-keyring.gpg
      register: gh_keyring

    - name: Run git-lfs
      ansible.builtin.command: git-lfs version
      changed_when: false

    - name: Read the system-wide git config
      ansible.builtin.slurp:
        src: /etc/gitconfig
      register: system_gitconfig

    - name: Look up the login user
      ansible.builtin.getent:
        database: passwd
        key: vmuser

    - name: Assert the stack is in place
      ansible.builtin.assert:
        that:
          - "'tmux' in ansible_facts.packages"
          - "'curl' in ansible_facts.packages"
          - "'zsh' in ansible_facts.packages"
          - devpod_bin.stat.exists and devpod_bin.stat.executable
          - "'PasswordAuthentication no' in (sshd_dropin.content | b64decode)"
          - ansible_facts.getent_passwd.vmuser[5] == '/usr/bin/zsh'
          - "'git-lfs' in ansible_facts.packages"
          - "'git-lfs filter-process' in (system_gitconfig.content | b64decode)"
          - uv_version.stdout is search('^uv 0[.]13[.]6 ')
          - uvx_version.stdout is search('^uvx 0[.]13[.]6 ')
          - claude_version.stdout is search('Claude Code')
          - "'downloads.claude.ai/claude-code/apt/stable' in (claude_sources.content | b64decode)"
          - "'Suites: stable' in (claude_sources.content | b64decode)"
          - gh_version.stdout is search('^gh version ')
          - "'cli.github.com/packages' in (gh_sources.content | b64decode)"
          - "'Suites: stable' in (gh_sources.content | b64decode)"
          - "'Signed-By: /etc/apt/keyrings/githubcli-archive-keyring.gpg' in (gh_sources.content | b64decode)"
          - gh_keyring.stat.exists
          - gh_keyring.stat.mode == '0644'
          - gh_keyring.stat.pw_name == 'root'
          - "'libc6-dev' in ansible_facts.packages"
          - "'build-essential' in ansible_facts.packages"
          - "'7zip' in ansible_facts.packages"
          - "'pipx' in ansible_facts.packages"

    - name: Assert qemu-guest-agent is not installed by default
      ansible.builtin.assert:
        that:
          - "'qemu-guest-agent' not in ansible_facts.packages"
        fail_msg: qemu-guest-agent is a VM concern; the role must not install it unless asked.
